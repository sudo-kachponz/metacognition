<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Background Slate Circle for Tab Visibility -->
  <circle cx="16" cy="16" r="15" fill="#0f172a" />
  
  <!-- Presynaptic Terminal - Red -->
  <path d="M 4,16 L 10,16" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="12" cy="16" r="2.2" fill="#ef4444" />

  <!-- Postsynaptic Terminal - Blue -->
  <circle cx="20" cy="16" r="2.2" fill="#3b82f6" />
  <path d="M 22,16 L 28,16" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />

  <!-- Synaptic Cleft Transmitters - Green -->
  <circle cx="16" cy="16" r="1.2" fill="#22c55e" />
  <path d="M 15.5,12.5 A 1.5,1.5 0 0,1 16.5,12.5" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 15.5,19.5 A 1.5,1.5 0 0,0 16.5,19.5" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" />
</svg>
