[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-speech-decoder"
version = "0.1.0"
description = "BCI Speech Decoder Platform — FastAPI Backend"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Engineering Reality", email = "dev@engineering-reality.id" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "websockets>=13.0",
    "torch>=2.5.0",
    "numpy>=1.24.0,<2.0",
    "scipy>=1.13.0",
    "mne>=1.8.0",
    "pylsl>=1.16.2",
    "scikit-learn>=1.5.0",
    "influxdb-client>=1.46.0",
    "sqlalchemy>=2.0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
    "mypy>=1.11",
]
notebooks = [
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "ipywidgets>=8.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
